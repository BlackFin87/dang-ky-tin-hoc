<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký lớp bồi dưỡng Tin học</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            border-top: 6px solid #0056b3;
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 22px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], 
        input[type="tel"], 
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, 
        input[type="tel"]:focus, 
        select:focus {
            border-color: #ff7f50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 127, 80, 0.2);
        }
        .btn-submit {
            width: 100%;
            background-color: #ff7f50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #e0693c;
        }
        .note {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>ĐĂNG KÝ LỚP BỒI DƯỠNG TIN HỌC KHỐI 4</h2>
        
        <!-- Thay YOUR_ENDPOINT_URL bằng link Formspree hoặc Google Apps Script -->
        <form action="https://script.google.com/macros/s/AKfycbxseGnKDEhsm8Q3pVlfrlIZ5cU3wkSudycIiiipfXcYYPc-CPD0srNPJixCfGzzzLrNIw/exec" method="POST">
            
            <div class="form-group">
                <label for="studentName">Họ và tên học sinh:</label>
                <input type="text" id="studentName" name="Họ và tên HS" required placeholder="Ví dụ: Nguyễn Văn A">
            </div>

            <div class="form-group">
                <label for="className">Lớp:</label>
                <input type="text" id="className" name="Lớp" required placeholder="Ví dụ: 4/1">
            </div>

            <div class="form-group">
                <label for="parentName">Họ tên Phụ huynh:</label>
                <input type="text" id="parentName" name="Họ tên PH" required placeholder="Nhập họ tên phụ huynh">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại / Zalo:</label>
                <input type="tel" id="phone" name="Số điện thoại" required placeholder="Nhập số điện thoại liên hệ">
            </div>

            <div class="form-group">
                <label for="laptop">Tình trạng Laptop cá nhân:</label>
                <select id="laptop" name="Laptop" required>
                    <option value="" disabled selected>-- Vui lòng chọn --</option>
                    <option value="Đã có sẵn">Bé đã có sẵn laptop mang theo</option>
                    <option value="Sẽ trang bị">Gia đình sẽ chuẩn bị khi vào học</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">GỬI ĐĂNG KÝ</button>
        </form>
        
        <p class="note">Thông tin được bảo mật và chỉ dùng để liên hệ sắp xếp lớp học.</p>
    </div>

</body>
</html>
