<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký lớp bồi dưỡng Tin học - Thầy Định</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-gradient: linear-gradient(135deg, #E0E7FF 0%, #C7D2FE 100%);
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-wrapper {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-section h2 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        select.input-field {
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled):hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 24px;
            font-weight: 600;
        }

        /* Giao diện Popup thông báo thành công */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .modal-title {
            color: #10B981;
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 10px 0;
        }

        .modal-text {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 24px;
        }

        .btn-close {
            padding: 10px 24px;
            background: #F3F4F6;
            color: var(--text-main);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-close:hover {
            background: #E5E7EB;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="form-wrapper">
        <div class="header-section">
            <h2>ĐĂNG KÝ LỚP TIN HỌC</h2>
            <p>Nâng cao kỹ năng máy tính & tư duy logic</p>
        </div>
        
        <form id="registerForm">
            <div class="input-group">
                <label for="studentName">Họ và tên học sinh</label>
                <input type="text" id="studentName" name="Họ và tên HS" class="input-field" required placeholder="Nhập họ tên đầy đủ của bé">
            </div>

            <div class="input-group">
                <label for="className">Lớp</label>
                <input type="text" id="className" name="Lớp" class="input-field" required placeholder="Ví dụ: 4/1, 5/2...">
            </div>

            <div class="input-group">
                <label for="parentName">Họ tên Phụ huynh</label>
                <input type="text" id="parentName" name="Họ tên PH" class="input-field" required placeholder="Người liên hệ chính">
            </div>

            <div class="input-group">
                <label for="phone">Số điện thoại / Zalo</label>
                <input type="tel" id="phone" name="Số điện thoại" class="input-field" required placeholder="Nhập số điện thoại liên hệ">
            </div>

            <div class="input-group">
                <label for="laptop">Tình trạng Laptop cá nhân</label>
                <select id="laptop" name="Laptop" class="input-field" required>
                    <option value="" disabled selected>-- Vui lòng chọn tình trạng --</option>
                    <option value="Đã có sẵn">Bé đã có sẵn laptop mang theo</option>
                    <option value="Sẽ trang bị">Gia đình sẽ chuẩn bị khi vào học</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">GỬI THÔNG TIN ĐĂNG KÝ</button>
        </form>
        
        <div class="footer-note">
            🛡️ Dữ liệu được bảo mật và gửi trực tiếp cho Thầy Định.
        </div>

        <!-- Bảng thông báo thành công (Popup) -->
        <div class="modal-overlay" id="successModal">
            <div class="modal-icon">🎉</div>
            <h3 class="modal-title">Đăng ký thành công!</h3>
            <p class="modal-text">Thầy Định đã nhận được thông tin. Thầy sẽ sớm liên hệ lại với gia đình nhé.</p>
            <button class="btn-close" onclick="closeModal()">Đóng lại</button>
        </div>
    </div>

    <!-- Script xử lý gửi dữ liệu ngầm -->
    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const modal = document.getElementById('successModal');

        // THẦY DÁN LINK GOOGLE APPS SCRIPT VÀO ĐÂY (NẰM GIỮA 2 DẤU NGOẶC ĐƠN)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxseGnKDEhsm8Q3pVlfrlIZ5cU3wkSudycIiiipfXcYYPc-CPD0srNPJixCfGzzzLrNIw/exec';

        form.addEventListener('submit', e => {
            e.preventDefault(); // Ngăn chặn hành vi nhảy trang mặc định
            
            // Đổi giao diện nút bấm
            submitBtn.innerText = 'Đang gửi dữ liệu...';
            submitBtn.disabled = true;

            // Gửi dữ liệu đi
            fetch(scriptURL, { method: 'POST', body: new URLSearchParams(new FormData(form)), mode: 'no-cors' })
                .then(() => {
                    // Hiển thị popup thành công
                    modal.style.display = 'flex';
                    // Đặt lại form và nút bấm
                    form.reset();
                    submitBtn.innerText = 'GỬI THÔNG TIN ĐĂNG KÝ';
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    alert('Đường truyền bị lỗi, quý phụ huynh vui lòng thử lại sau ạ!');
                    submitBtn.innerText = 'GỬI THÔNG TIN ĐĂNG KÝ';
                    submitBtn.disabled = false;
                });
        });

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
